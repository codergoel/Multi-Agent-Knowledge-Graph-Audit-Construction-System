variables:
  DATA_DIRECTORY:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  NEO4J_DATABASE:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  NEO4J_IMPORT_DIR:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  NEO4J_PASSWORD:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  NEO4J_URI:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  NEO4J_USERNAME:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]

files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*', '*.csv']
      caller: [list_available_files, get_neo4j_import_directory]
  .env:
    type: literal
    actions: [read]
    params:
      path: [project_root]
      caller: [load_env]
  data/story1:
    type: literal
    actions: [read]
    params:
      caller: [scan_csv_for_duplicates, check_missing_required_fields, check_foreign_keys]
  data_dir:
    type: variable
    actions: [read]
    params:
      caller: [data_dir.rglob]
  DATA_DIRECTORY:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [Path, open]
  full_path:
    type: variable
    actions: [read]
    params:
      caller: [open, csv.DictReader]
      alias: [f]
  full_path_to_file:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [file]
  local_import_dir:
    type: variable
    actions: [read]
    params:
      caller: [local_import_dir.glob]
  NEO4J_IMPORT_DIR:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  ref_path:
    type: variable
    actions: [read]
    params:
      caller: [open, csv.DictReader]
      alias: [f]
  source_path:
    type: variable
    actions: [read]
    params:
      caller: [open, csv.DictReader]
      alias: [f]

processes:
  docker:
    type: shell
    actions: [exec]
    args: [[ps, --filter, name=neo4j, --format, '{{.Names}}'], [cp, str(csv_file), '{container_name}:/var/lib/neo4j/import/']]
    params:
      caller: [subprocess.run]
      shell: ["False", "False"]
